<html
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="mfa_unlock.messages:title" /></h1>
    <f:if condition="{lockedUsers}">
        <f:then>
            <div class="table-fit">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th><f:translate key="mfa_unlock.messages:column.uid" /></th>
                            <th><f:translate key="mfa_unlock.messages:column.username" /></th>
                            <th><f:translate key="mfa_unlock.messages:column.name" /></th>
                            <th><f:translate key="mfa_unlock.messages:column.providers" /></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{lockedUsers}" as="lockedUser">
                            <tr>
                                <td>{lockedUser.uid}</td>
                                <td>
                                    {lockedUser.username}
                                    <f:if condition="{lockedUser.disabled}">
                                        <span class="badge badge-warning"><f:translate key="mfa_unlock.messages:disabled" /></span>
                                    </f:if>
                                </td>
                                <td>{lockedUser.realName}</td>
                                <td>
                                    <f:for each="{lockedUser.providers}" as="providerTitle">
                                        <span class="badge badge-danger"><f:translate key="{providerTitle}" default="{providerTitle}" /></span>
                                    </f:for>
                                </td>
                                <td class="text-end">
                                    <form action="{actionUri}" method="post">
                                        <input type="hidden" name="{requestTokenName}" value="{requestTokenValue}">
                                        <input type="hidden" name="user" value="{lockedUser.uid}">
                                        <button type="submit" class="btn btn-success btn-sm">
                                            <core:icon identifier="actions-unlock" />
                                            <f:translate key="mfa_unlock.messages:unlock" />
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
            <form action="{actionUri}" method="post">
                <input type="hidden" name="{requestTokenName}" value="{requestTokenValue}">
                <input type="hidden" name="all" value="1">
                <button type="submit" class="btn btn-success">
                    <f:translate key="mfa_unlock.messages:unlockAll" />
                </button>
            </form>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <div class="callout-content">
                    <div class="callout-body"><f:translate key="mfa_unlock.messages:empty" /></div>
                </div>
            </div>
        </f:else>
    </f:if>
</f:section>

</html>
